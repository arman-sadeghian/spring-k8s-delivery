name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode clean test

      - name: Package application
        run: mvn --batch-mode package -DskipTests

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/arman-sadeghian/spring-k8s-delivery:${{ github.sha }} \
            -t ghcr.io/arman-sadeghian/spring-k8s-delivery:latest \
            .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/arman-sadeghian/spring-k8s-delivery:${{ github.sha }}
          docker push ghcr.io/arman-sadeghian/spring-k8s-delivery:latest